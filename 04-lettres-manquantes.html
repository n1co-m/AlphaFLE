<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les lettres manquantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fdfeff;
    --line: #d3dcf0;
    --margin: #ec8a93;
    --ink: #1d2b64;
    --ink-soft: #5a6694;
    --ok: #2a8a58;
    --ok-bg: #e3f4ea;
    --warn: #d2691e;
    --tile: #ffffff;
    --slot: #f2f5fc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Andika", "Trebuchet MS", Verdana, sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(to right, transparent 47px, var(--margin) 47px, var(--margin) 49px, transparent 49px),
      repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--line) 31px, var(--line) 32px);
    min-height: 100vh;
    padding: 24px 16px 48px 64px;
  }
  main { max-width: 1040px; margin: 0 auto; }
  .retour { display: inline-block; margin-bottom: 10px; color: var(--ink-soft); font-weight: 700; }
  .retour:hover { color: var(--ink); }
  h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); margin: 0 0 4px; }
  .consigne { margin: 0 0 20px; font-size: 1.1rem; color: var(--ink-soft); max-width: 60ch; }
  h2 { font-size: 1rem; margin: 22px 0 8px; color: var(--ink-soft); font-weight: 700; }

  .grid {
    display: grid;
    grid-template-columns: repeat(13, minmax(0, 1fr));
    gap: 6px;
  }
  .cell, .blank {
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font: 700 clamp(1.1rem, 3.2vw, 2rem) "Andika", sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  .lower .cell, .lower .blank { text-transform: lowercase; }

  .cell { background: var(--tile); border: 2px solid var(--ink); cursor: pointer; }
  .blank {
    width: 100%; min-width: 0; padding: 0; text-align: center;
    background: #fff; color: var(--ink);
    border: 3px dashed var(--warn);
    caret-color: var(--ink);
  }
  .blank::placeholder { color: var(--line); }
  .blank:focus { outline: 3px solid var(--ink); outline-offset: 2px; border-style: solid; }
  .blank.done { background: var(--ok-bg); border: 2px solid var(--ok); color: var(--ok); cursor: pointer; }
  .blank.shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 22px; }
  .action {
    display: inline-block; text-decoration: none;
    font: 700 1rem "Andika", sans-serif; color: var(--ink);
    background: #fff; border: 2px solid var(--ink); border-radius: 999px;
    padding: 10px 18px; cursor: pointer;
  }
  .action:hover { background: #eef2ff; }
  .suivant[aria-disabled="true"] { opacity: .4; pointer-events: none; border-style: dashed; }
  .suivant.pret { background: var(--ok); border-color: var(--ok); color: #fff; }
  .suivant.pret:hover { background: #237548; }
  button:focus-visible, .cell:focus-visible, .action:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
  #score { font-weight: 700; margin-left: auto; }
  #msg { min-height: 1.6em; margin: 14px 0 0; font-size: 1.15rem; font-weight: 700; }
  #msg.ok { color: var(--ok); }
  #msg.warn { color: var(--warn); }

  @media (max-width: 700px) {
    body { padding-left: 24px; background-position: -20px 0, 0 0; }
    .grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .blank.shake { animation: none; }
  }
</style>
</head>
<body>
<main id="app">
  <a class="retour" href="index.html">← Retour au sommaire</a>
  <h1>Les lettres manquantes</h1>
  <p class="consigne">Dans l’alphabet du bas, il manque des lettres. Clique sur une case vide, puis tape la lettre qui manque sur le clavier. Touche une lettre pour l’entendre.</p>

  <h2>Le modèle</h2>
  <div class="grid" id="model" aria-label="Alphabet modèle"></div>

  <h2>À toi de jouer</h2>
  <div class="grid" id="incomplet" aria-label="Alphabet incomplet"></div>

  <p id="msg" role="status" aria-live="polite"></p>

  <div class="bar">
    <button class="action" id="reset" type="button">Recommencer</button>
    <!-- Adresse de l’exercice suivant : modifiez le href ci-dessous -->
    <a class="action suivant" id="suivant" href="05-lettres-manquantes-2" aria-disabled="true" tabindex="-1">Exercice suivant</a>
    <button class="action" id="case" type="button" aria-pressed="false">Majuscules / minuscules</button>
    <span id="score"></span>
  </div>
</main>

<script>
(() => {
  const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  // Lettres à retrouver : modifiez cette liste pour changer l’exercice
  const MANQUANTES = ["C", "G", "K", "P", "V"];
  // Noms des lettres en français, pour une lecture correcte par la synthèse vocale
  const NOMS = {
    A:"a", B:"bé", C:"cé", D:"dé", E:"eu", F:"effe", G:"gé", H:"ache", I:"i", J:"ji",
    K:"ka", L:"elle", M:"emme", N:"enne", O:"o", P:"pé", Q:"ku", R:"erre", S:"esse",
    T:"té", U:"u", V:"vé", W:"double vé", X:"ixe", Y:"i grec", Z:"zède"
  };

  const $ = (id) => document.getElementById(id);
  const model = $("model"), incomplet = $("incomplet");
  const msg = $("msg"), score = $("score");
  let trouvees = 0;

  /* ---------- Synthèse vocale ---------- */
  let frVoice = null;
  function pickVoice() {
    const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    frVoice = voices.find(v => v.lang === "fr-FR") || voices.find(v => v.lang.startsWith("fr")) || null;
  }
  if ("speechSynthesis" in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }
  function speak(letter) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(NOMS[letter] || letter);
    u.lang = "fr-FR";
    u.rate = 0.8;
    if (frVoice) u.voice = frVoice;
    speechSynthesis.speak(u);
  }
  function say(text, type) { msg.textContent = text; msg.className = type || ""; }

  /* ---------- Construction ---------- */
  function makeCell(l) {
    const c = document.createElement("div");
    c.className = "cell"; c.textContent = l; c.tabIndex = 0;
    c.addEventListener("click", () => speak(l));
    c.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); speak(l); } });
    return c;
  }

  function buildModel() {
    model.innerHTML = "";
    ALPHABET.forEach(l => model.appendChild(makeCell(l)));
  }

  function nextEmpty(from) {
    const blanks = [...incomplet.querySelectorAll(".blank:not(.done)")];
    return blanks.find(b => b.compareDocumentPosition(from) & Node.DOCUMENT_POSITION_PRECEDING) || blanks[0] || null;
  }

  function makeBlank(l, i) {
    const inp = document.createElement("input");
    inp.type = "text"; inp.className = "blank"; inp.maxLength = 1;
    inp.placeholder = "?";
    inp.autocomplete = "off"; inp.spellcheck = false;
    inp.setAttribute("autocapitalize", "characters");
    inp.setAttribute("aria-label", "Lettre manquante, case " + (i + 1));

    inp.addEventListener("input", () => {
      const v = inp.value.trim().toUpperCase();
      if (!v) { inp.value = ""; return; }
      if (v === l) {
        inp.value = l; inp.readOnly = true;
        inp.classList.add("done");
        inp.setAttribute("aria-label", "Case " + (i + 1) + " : " + l);
        trouvees++;
        speak(l);
        say("Bien joué !", "ok");
        updateScore();
        const suite = nextEmpty(inp);
        if (suite) suite.focus(); else inp.blur();
      } else {
        inp.value = "";
        inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake");
        say("Ce n’est pas la bonne lettre. Regarde bien le modèle en haut.", "warn");
      }
    });
    inp.addEventListener("click", () => { if (inp.readOnly) speak(l); });
    return inp;
  }

  function buildIncomplet() {
    incomplet.innerHTML = "";
    ALPHABET.forEach((l, i) => {
      incomplet.appendChild(MANQUANTES.includes(l) ? makeBlank(l, i) : makeCell(l));
    });
  }

  function updateScore() {
    score.textContent = trouvees + " / " + MANQUANTES.length + " lettres retrouvées";
    const suivant = $("suivant"), fini = trouvees === MANQUANTES.length;
    suivant.setAttribute("aria-disabled", fini ? "false" : "true");
    suivant.tabIndex = fini ? 0 : -1;
    suivant.classList.toggle("pret", fini);
    if (fini) say("Bravo ! Tu as retrouvé toutes les lettres manquantes. Tu peux retourner au sommaire.", "ok");
  }

  function reset() {
    trouvees = 0;
    buildIncomplet(); updateScore(); say("");
  }

  /* ---------- Boutons ---------- */
  $("reset").addEventListener("click", reset);
  $("case").addEventListener("click", e => {
    const lower = $("app").classList.toggle("lower");
    e.currentTarget.setAttribute("aria-pressed", lower);
  });

  buildModel(); reset();
})();
</script>
</body>
</html>
