<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L’alphabet en minuscules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fdfeff;
    --line: #d3dcf0;
    --margin: #ec8a93;
    --ink: #1d2b64;
    --ink-soft: #5a6694;
    --ok: #2a8a58;
    --ok-bg: #e3f4ea;
    --warn: #d2691e;
    --tile: #ffffff;
    --tile-edge: #1d2b64;
    --slot: #f2f5fc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Andika", "Trebuchet MS", Verdana, sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    /* lignes façon cahier Seyès */
    background-image:
      linear-gradient(to right, transparent 47px, var(--margin) 47px, var(--margin) 49px, transparent 49px),
      repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--line) 31px, var(--line) 32px);
    min-height: 100vh;
    padding: 24px 16px 48px 64px;
  }
  main { max-width: 1040px; margin: 0 auto; }
  .retour { display: inline-block; margin-bottom: 10px; color: var(--ink-soft); font-weight: 700; }
  .retour:hover { color: var(--ink); }
  h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); margin: 0 0 4px; }
  .consigne { margin: 0 0 20px; font-size: 1.1rem; color: var(--ink-soft); max-width: 60ch; }

  h2 { font-size: 1rem; margin: 22px 0 8px; color: var(--ink-soft); font-weight: 700; }

  .grid {
    display: grid;
    grid-template-columns: repeat(13, minmax(0, 1fr));
    gap: 6px;
  }
  .cell, .slot, .tile {
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font: 700 clamp(1.3rem, 3.6vw, 2.2rem) "Courier New", Courier, monospace;
    user-select: none; -webkit-user-select: none;
  }
  .lower .cell, .lower .tile, .lower .slot { text-transform: lowercase; }

  .cell { background: var(--tile); border: 2px solid var(--ink); cursor: pointer; }
  .slot { background: var(--slot); border: 2px dashed var(--line); color: var(--ok); cursor: pointer; }
  .slot.over { border-color: var(--ink); background: #e4eafb; }
  .slot.done { background: var(--ok-bg); border: 2px solid var(--ok); }
  .slot.shake { animation: shake .35s; border-color: var(--warn); }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  #pool {
    display: grid;
    grid-template-columns: repeat(13, minmax(0, 1fr));
    gap: 6px;
    min-height: 60px;
    padding: 10px; border-radius: 14px;
    background: rgba(255,255,255,.85);
    border: 2px solid var(--line);
  }
  .tile {
    background: var(--tile); border: 2px solid var(--tile-edge);
    box-shadow: 0 3px 0 var(--tile-edge);
    cursor: grab; touch-action: none; color: var(--ink); padding: 0;
  }
  .tile.selected { background: #fff3c4; outline: 3px solid var(--warn); outline-offset: 1px; }
  .tile.shake { animation: shake .35s; }
  .tile.dragging { opacity: .35; }
  .ghost {
    position: fixed; z-index: 99; pointer-events: none;
    background: #fff3c4; border: 2px solid var(--tile-edge);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font: 700 2.2rem "Courier New", Courier, monospace; color: var(--ink);
    box-shadow: 0 8px 18px rgba(29,43,100,.3);
  }
  .ghost { text-transform: lowercase; }

  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 22px; }
  .action {
    display: inline-block; text-decoration: none;
    font: 700 1rem "Andika", sans-serif; color: var(--ink);
    background: #fff; border: 2px solid var(--ink); border-radius: 999px;
    padding: 10px 18px; cursor: pointer;
  }
  .action:hover { background: #eef2ff; }
  .suivant[aria-disabled="true"] { opacity: .4; pointer-events: none; border-style: dashed; }
  .suivant.pret { background: var(--ok); border-color: var(--ok); color: #fff; }
  .suivant.pret:hover { background: #237548; }
  button:focus-visible, .slot:focus-visible, .cell:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
  #score { font-weight: 700; margin-left: auto; }
  #msg { min-height: 1.6em; margin: 14px 0 0; font-size: 1.15rem; font-weight: 700; }
  #msg.ok { color: var(--ok); }
  #msg.warn { color: var(--warn); }

  @media (max-width: 700px) {
    body { padding-left: 24px; background-position: -20px 0, 0 0; }
    .grid, #pool { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .slot.shake, .tile.shake { animation: none; }
  }
</style>
</head>
<body>
<main id="app" class="lower">
  <a class="retour" href="index.html">← Retour au sommaire</a>
  <h1>L’alphabet en minuscules</h1>
  <p class="consigne">Glisse chaque lettre du bas dans la bonne case du tableau vide. Touche une lettre pour l’entendre.</p>

  <h2>Le modèle</h2>
  <div class="grid" id="model" aria-label="Alphabet modèle"></div>

  <h2>À toi de jouer</h2>
  <div class="grid" id="target" aria-label="Tableau à remplir"></div>

  <h2>Les lettres mélangées</h2>
  <div id="pool" aria-label="Lettres à placer"></div>

  <p id="msg" role="status" aria-live="polite"></p>

  <div class="bar">
    <button class="action" id="reset" type="button">Mélanger à nouveau</button>
    <!-- Adresse de l’exercice suivant : modifiez le href ci-dessous -->
    <a class="action suivant" id="suivant" href="03-alphabet-sans-modele.html" aria-disabled="true" tabindex="-1">Exercice Suivant</a>
    <span id="score"></span>
  </div>
</main>

<script>
(() => {
  const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  // Noms des lettres en français, pour une lecture correcte par la synthèse vocale
  const NOMS = {
    A:"a", B:"bé", C:"cé", D:"dé", E:"eu", F:"effe", G:"gé", H:"ache", I:"i", J:"ji",
    K:"ka", L:"elle", M:"emme", N:"enne", O:"o", P:"pé", Q:"ku", R:"erre", S:"esse",
    T:"té", U:"u", V:"vé", W:"double vé", X:"ixe", Y:"i grec", Z:"zède"
  };

  const $ = (id) => document.getElementById(id);
  const model = $("model"), target = $("target"), pool = $("pool");
  const msg = $("msg"), score = $("score");
  let placed = new Array(26).fill(false);
  let selected = null;

  /* ---------- Synthèse vocale ---------- */
  let frVoice = null;
  function pickVoice() {
    const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    frVoice = voices.find(v => v.lang === "fr-FR") || voices.find(v => v.lang.startsWith("fr")) || null;
  }
  if ("speechSynthesis" in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }
  function speak(letter) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(NOMS[letter] || letter);
    u.lang = "fr-FR";
    u.rate = 0.8;
    if (frVoice) u.voice = frVoice;
    speechSynthesis.speak(u);
  }

  function say(text, type) {
    msg.textContent = text;
    msg.className = type || "";
  }

  /* ---------- Construction ---------- */
  function buildModel() {
    model.innerHTML = "";
    ALPHABET.forEach(l => {
      const c = document.createElement("div");
      c.className = "cell"; c.textContent = l; c.tabIndex = 0;
      c.addEventListener("click", () => speak(l));
      c.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); speak(l); } });
      model.appendChild(c);
    });
  }

  function buildTarget() {
    target.innerHTML = "";
    ALPHABET.forEach((l, i) => {
      const s = document.createElement("div");
      s.className = "slot"; s.dataset.i = i; s.tabIndex = 0;
      s.setAttribute("aria-label", "Case " + (i + 1));
      s.addEventListener("click", () => {
        if (placed[i]) { speak(l); return; }
        if (selected) tryPlace(selected, i);
      });
      s.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); s.click(); }
      });
      target.appendChild(s);
    });
  }

  function shuffle(a) {
    a = a.slice();
    do {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
    } while (a.every((x, i) => x === ALPHABET[i]));
    return a;
  }

  function buildPool() {
    pool.innerHTML = "";
    shuffle(ALPHABET).forEach(l => {
      const t = document.createElement("button");
      t.type = "button"; t.className = "tile"; t.textContent = l; t.dataset.l = l;
      t.setAttribute("aria-label", "Lettre " + l);
      enableDrag(t);
      pool.appendChild(t);
    });
  }

  function updateScore() {
    const n = placed.filter(Boolean).length;
    score.textContent = n + " / 26 lettres placées";
    const suivant = $("suivant"), fini = n === 26;
    suivant.setAttribute("aria-disabled", fini ? "false" : "true");
    suivant.tabIndex = fini ? 0 : -1;
    suivant.classList.toggle("pret", fini);
    if (fini) say("Bravo ! Tu as remis tout l’alphabet dans l’ordre. Tu peux retourner au sommaire.", "ok");
  }

  function reset() {
    placed.fill(false); selected = null;
    buildTarget(); buildPool(); updateScore(); say("");
  }

  /* ---------- Placement ---------- */
  function shake(el) {
    el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
    setTimeout(() => el.classList.remove("shake"), 400);
  }

  function tryPlace(tile, i) {
    const l = tile.dataset.l;
    const slot = target.children[i];
    if (placed[i]) return false;
    if (ALPHABET[i] === l) {
      placed[i] = true;
      slot.textContent = l;
      slot.classList.add("done");
      slot.setAttribute("aria-label", "Case " + (i + 1) + " : " + l);
      tile.remove();
      selected = null;
      speak(l);
      say("Bien joué !", "ok");
      updateScore();
      return true;
    }
    shake(slot); shake(tile);
    say("Pas dans cette case. Regarde le modèle en haut.", "warn");
    return false;
  }

  /* ---------- Glisser-déposer (souris, doigt, stylet) + simple clic ---------- */
  function enableDrag(tile) {
    let startX, startY, ghost = null, moved = false, over = null;

    tile.addEventListener("pointerdown", e => {
      if (e.button !== undefined && e.button !== 0) return;
      startX = e.clientX; startY = e.clientY; moved = false;
      tile.setPointerCapture(e.pointerId);
    });

    tile.addEventListener("pointermove", e => {
      if (!tile.hasPointerCapture(e.pointerId)) return;
      if (!moved && Math.hypot(e.clientX - startX, e.clientY - startY) > 8) {
        moved = true;
        const r = tile.getBoundingClientRect();
        ghost = document.createElement("div");
        ghost.className = "ghost";
        ghost.textContent = tile.dataset.l;
        ghost.style.width = r.width + "px"; ghost.style.height = r.height + "px";
        document.body.appendChild(ghost);
        tile.classList.add("dragging");
        speak(tile.dataset.l);
      }
      if (moved) {
        ghost.style.left = (e.clientX - ghost.offsetWidth / 2) + "px";
        ghost.style.top = (e.clientY - ghost.offsetHeight / 2) + "px";
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const slot = el && el.closest(".slot");
        if (over && over !== slot) over.classList.remove("over");
        over = slot && !slot.classList.contains("done") ? slot : null;
        if (over) over.classList.add("over");
      }
    });

    const end = e => {
      if (!tile.hasPointerCapture(e.pointerId)) return;
      tile.releasePointerCapture(e.pointerId);
      if (moved) {
        if (ghost) ghost.remove();
        ghost = null;
        tile.classList.remove("dragging");
        if (over) {
          over.classList.remove("over");
          tryPlace(tile, Number(over.dataset.i));
        }
        over = null;
      } else if (e.type === "pointerup") {
        // simple clic : lire la lettre et la sélectionner
        speak(tile.dataset.l);
        const was = selected === tile;
        pool.querySelectorAll(".selected").forEach(t => t.classList.remove("selected"));
        selected = was ? null : tile;
        if (selected) { tile.classList.add("selected"); say("Touche maintenant la case où elle va, ou glisse-la."); }
        else say("");
      }
    };
    tile.addEventListener("pointerup", end);
    tile.addEventListener("pointercancel", end);
    tile.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); speak(tile.dataset.l); pool.querySelectorAll(".selected").forEach(t => t.classList.remove("selected")); selected = tile; tile.classList.add("selected"); }
    });
  }

  /* ---------- Boutons ---------- */
  $("reset").addEventListener("click", reset);

  buildModel(); reset();
})();
</script>
</body>
</html>
